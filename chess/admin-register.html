<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THINKMATE CHESS ACADEMY ♕ - Admin Registration</title>
    <link rel="icon" type="image/png" sizes="32x32" href="log img (1).png">
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: #222;
            border: 2px solid #d4af37;
            padding: 30px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25);
        }
        .auth-card h2 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ccc;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #000;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus {
            border-color: #d4af37;
        }
        .auth-btn {
            width: 100%;
            background: #d4af37;
            color: #000;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
            transition: background 0.3s ease;
        }
        .auth-btn:hover {
            background: #f3cf55;
        }
        .toggle-text {
            text-align: center;
            font-size: 13px;
            margin-top: 15px;
            color: #aaa;
        }
        .toggle-text a {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
        }
        .toggle-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h2>Admin Registration ♕</h2>
    
    <form id="adminRegisterForm">
        <div class="form-group">
            <label>Admin Full Name</label>
            <input type="text" id="adminName" placeholder="Enter Full Name" required>
        </div>

        <div class="form-group">
            <label>Admin Email Address</label>
            <input type="email" id="adminEmail" placeholder="admin@thinkmate.com" required>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" id="adminMobile" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
        </div>

        <div class="form-group">
            <label>Master Password</label>
            <input type="password" id="adminPassword" placeholder="Create Master Password" required>
        </div>

        <button type="submit" class="auth-btn">Register as Admin</button>
    </form>

    <div class="toggle-text">
        Already have an Admin account? <a href="admin-login.html">Login here</a>
    </div>
    <div class="toggle-text" style="margin-top: 10px;">
        <a href="register.html" style="color: #aaa; font-size: 12px;">← Back to Student Registration</a>
    </div>
</div>

<script src="admin-register.js"></script>
</body>
</html>
