<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THINKMATE CHESS ACADEMY ♕ - Admin Portal</title>
    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: #222;
            border: 2px solid #d4af37;
            padding: 30px;
            border-radius: 12px;
            width: 360px;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2);
        }
        .auth-card h2 { color: #d4af37; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #ccc; }
        .form-group input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #000; color: #fff; box-sizing: border-box; }
        .auth-btn { width: 100%; background: #d4af37; color: #000; font-weight: bold; padding: 10px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .toggle-text { text-align: center; font-size: 13px; margin-top: 15px; color: #aaa; }
        .toggle-text span { color: #d4af37; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 id="adminFormTitle">Admin Portal Login ♕</h2>
    
    <form id="adminAuthForm">
        <div class="form-group" id="adminNameGroup" style="display: none;">
            <label>Admin Full Name</label>
            <input type="text" id="adminName" placeholder="Enter Full Name">
        </div>
        
        <div class="form-group">
            <label>Admin Email</label>
            <input type="email" id="adminEmail" placeholder="admin@thinkmate.com" required>
        </div>
        <div class="form-group">
            <label>Master Password</label>
            <input type="password" id="adminPassword" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="auth-btn" id="adminSubmitBtn">Login as Admin</button>
    </form>

    <div class="toggle-text">
        <span id="toggleAdminAuthMode">Register new admin account</span>
    </div>
</div>

<script src="admin-login.js"></script>
</body>
</html>
